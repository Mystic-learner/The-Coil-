<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>The Coil — Rhythm Snake</title>

  <!-- Font and Styles -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* === Mobile Controls Styling === */
    #mobile-controls {
      position: fixed;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 50;
    }

    .control-row {
      display: flex;
      justify-content: center;
      gap: 14px;
    }

    .ctrl-btn {
      width: 60px;
      height: 60px;
      background: rgba(120, 100, 255, 0.15);
      border: 2px solid rgba(150, 130, 255, 0.5);
      border-radius: 12px;
      color: #fff;
      font-size: 20px;
      text-shadow: 0 0 8px #a88cff;
      box-shadow: 0 0 10px rgba(130, 110, 255, 0.3);
      transition: all 0.15s ease;
    }

    .ctrl-btn:active {
      transform: scale(0.92);
      background: rgba(150, 130, 255, 0.35);
      box-shadow: 0 0 16px rgba(150, 130, 255, 0.8);
    }

    /* Hide controls on desktop */
    @media (min-width: 768px) {
      #mobile-controls {
        display: none;
      }
    }
  </style>
</head>
<body>
  <!-- === MAIN MENU === -->
  <div id="menu" class="overlay">
    <h1>THE COIL</h1>
    <p class="muted">One track. One beat. One chance.</p>
    <button id="startBtn" class="btn">Start Game</button>
    <button id="leaderBtn" class="btn ghost">Leaderboard</button>
    <p class="hint">Press any key after start to enable audio.</p>
  </div>

  <!-- === LEADERBOARD === -->
  <div id="leaderboard" class="overlay hidden">
    <h2>Leaderboard</h2>
    <ol id="scoresList"></ol>
    <div class="menu-actions">
      <button id="clearScores" class="btn ghost">Clear</button>
      <button id="backFromLeader" class="btn">Back</button>
    </div>
  </div>

  <!-- === PAUSE OVERLAY === -->
  <div id="paused" class="overlay hidden">
    <h2>PAUSED</h2>
    <p class="muted">Press P to resume</p>
  </div>

  <!-- === GAME === -->
  <div id="gameWrap">
    <canvas id="game" width="640" height="480"></canvas>
    <div id="hud">
      <div id="score">SCORE: 0</div>
      <div id="combo">COMBO: 0</div>
      <div id="controlsNote">Arrows or Z/D/X/C • P = Pause • R = Restart</div>
    </div>
  </div>

  <!-- === MOBILE ARROW CONTROLS === -->
  <div id="mobile-controls">
    <div class="control-row">
      <button class="ctrl-btn" id="up">▲</button>
    </div>
    <div class="control-row">
      <button class="ctrl-btn" id="left">◀</button>
      <button class="ctrl-btn" id="down">▼</button>
      <button class="ctrl-btn" id="right">▶</button>
    </div>
  </div>

  <!-- === SCRIPT === -->
  <script src="script.js"></script>
</body>
</html>
